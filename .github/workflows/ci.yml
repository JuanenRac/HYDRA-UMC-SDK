name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same branch replaces an older one that is still going; the runs of main and of the tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Does the change touch anything but documents and pictures? Only the slow steps (Rust, Flutter, Android or Wear OS, firmware) wait for the answer; the manifest, the documents
  # and the tests of the tools always run. Main, the tags, a scheduled or manual run and a pull request with the label full-ci run everything, and when the answer cannot be found it is yes.
  changes:
    name: Which paths changed
    uses: JuanenRac/HYDRA-UMC-DOCS/.github/workflows/changed-paths.yml@38355d0677652f793846b1c0224ac27a631e7f83
    with:
      label: full-ci
      paths: |
        **
        !**/*.md
        !images/**
        !LICENSE*
        !.github/ISSUE_TEMPLATE/**
        !.github/PULL_REQUEST_TEMPLATE.md

  baseline:
    name: Validate project baseline
    needs: changes
    # runs even when the question above could not be answered (then the slow steps run too)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether the slow steps run
        id: slow
        env:
          REF: ${{ github.ref }}
          MATCHED: ${{ needs.changes.outputs.matched }}
        run: |
          if [ "$REF" = "refs/heads/main" ] || [ "${REF#refs/tags/}" != "$REF" ] || [ "$MATCHED" != "false" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only documents or pictures changed: the slow steps are skipped (label the pull request full-ci to run them)."
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Validate v1 SDK contract fixtures
        if: ${{ hashFiles('clients/python/tests/test_validation.py') != '' }}
        env:
          PYTHONPATH: clients/python/src
        run: |
          # jsonschema is optional for the library but lets the differential test
          # compare the Python validator with the normative schemas.
          python -m pip install jsonschema
          python -m unittest discover -s clients/python/tests -v
      - name: Lint the Python sources
        if: ${{ hashFiles('clients/python/tests/test_validation.py') != '' }}
        run: |
          python -m pip install ruff
          ruff check --select F,E9,B clients tools examples
      - name: Validate the schema/validator compatibility matrix and OpenAPI documents
        # Found while wiring in tools/verify_openapi.py: tools/verify_contract_matrix.py
        # was already documented (docs/CONTRACTS.md) as this SDK's "mandatory
        # compatibility gate", but this GitHub Actions workflow itself never
        # actually ran it - only tools/build_test.py (the LOCAL, non-CI
        # build-test.sh/.bat entry point) did. Real CI now runs both gates.
        if: ${{ hashFiles('tools/verify_contract_matrix.py') != '' }}
        env:
          PYTHONPATH: clients/python/src
        run: |
          python tools/verify_contract_matrix.py
          python tools/verify_openapi.py
          python tools/contract_source.py --check
          python tools/generate_types.py --check
          python tools/generate_routes.py --check
      - name: Set up Node.js
        if: ${{ hashFiles('package.json', 'clients/**/package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/**/package-lock.json
      - name: Validate Node.js or TypeScript project
        if: ${{ hashFiles('package.json', 'clients/**/package.json') != '' }}
        shell: bash
        run: |
          module_dir="."
          if [ ! -f package.json ]; then
            found="$(find . -mindepth 2 -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)"
            test -n "$found"
            module_dir="$(dirname "$found")"
          fi
          cd "$module_dir"
          npm ci --ignore-scripts
          npm run typecheck --if-present
          npm test --if-present
          npm run lint --if-present
      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml', 'clients/**/Cargo.toml') != '' && steps.slow.outputs.run == 'true' }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Validate Rust project
        if: ${{ hashFiles('Cargo.toml', 'clients/**/Cargo.toml') != '' && steps.slow.outputs.run == 'true' }}
        shell: bash
        run: |
          module_dir="."
          if [ ! -f Cargo.toml ]; then
            found="$(find . -mindepth 2 -name Cargo.toml -not -path '*/target/*' -not -path '*/.git/*' -print -quit)"
            test -n "$found"
            module_dir="$(dirname "$found")"
          fi
          cd "$module_dir"
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Set up Go
        if: ${{ hashFiles('go.mod', 'src/go.mod', 'clients/**/go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Validate Go project
        if: ${{ hashFiles('go.mod', 'src/go.mod', 'clients/**/go.mod') != '' }}
        shell: bash
        run: |
          module_dir="$(dirname "$(find . -name go.mod -not -path '*/.git/*' -print -quit)")"
          test -n "$module_dir"
          cd "$module_dir"
          go vet ./...
          go test -race ./...
          go build ./...
      - name: Set up Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' && steps.slow.outputs.run == 'true' }}
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Validate Flutter project
        if: ${{ hashFiles('pubspec.yaml') != '' && steps.slow.outputs.run == 'true' }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Set up Java for Android or Wear OS
        if: ${{ hashFiles('gradlew') != '' && steps.slow.outputs.run == 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Android or Wear OS project without a version bump
        if: ${{ hashFiles('gradlew') != '' && steps.slow.outputs.run == 'true' }}
        env:
          HYDRA_UMC_CI: "1"
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test
      - name: Install ARM GNU Toolchain for firmware projects
        if: ${{ hashFiles('build_firmware.sh') != '' && steps.slow.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Compile firmware without a version bump
        if: ${{ hashFiles('build_firmware.sh') != '' && steps.slow.outputs.run == 'true' }}
        env:
          HYDRA_UMC_CI: "1"
        shell: bash
        run: |
          chmod +x build_firmware.sh
          ./build_firmware.sh
