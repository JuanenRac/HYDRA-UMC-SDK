[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-sdk"
version = "0.0.5"
description = "Versioned contracts and lightweight Python validation for HYDRA-UMC"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}

[project.scripts]
hydra-umc-contract-validate = "hydra_umc_sdk.validation:main"

[tool.setuptools.packages.find]
where = ["src"]
