<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
  <title id="title">HYDRA-UMC-SDK repository layout</title>
  <desc id="desc">A visual map of the HYDRA-UMC-SDK repository directories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#100d25"/><stop offset="1" stop-color="#172d4e"/></linearGradient>
    <linearGradient id="root" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#00c6a9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <style>.t{font-family:Segoe UI,Arial,sans-serif;fill:#f5f1ff}.s{font-family:Segoe UI,Arial,sans-serif;fill:#c2c8df;font-size:20px}.n{font-family:Consolas,monospace;fill:#fbfaff;font-size:25px;font-weight:700}.l{stroke:#6a719d;stroke-width:3;fill:none}.c{fill:#202243;stroke:#56588d;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="690" rx="34" fill="url(#bg)"/>
  <circle cx="1450" cy="70" r="250" fill="#8b5cf6" opacity=".09"/><circle cx="80" cy="680" r="310" fill="#00c6a9" opacity=".07"/>
  <text x="70" y="86" class="t" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">HYDRA-UMC-SDK · Repository layout</text>
  <text x="70" y="123" class="s">Versioned contracts, thin clients, fixtures and conformance boundaries</text>
  <rect x="595" y="168" width="410" height="100" rx="20" fill="url(#root)" filter="url(#shadow)"/>
  <text x="642" y="210" class="n">◆ HYDRA-UMC-SDK/</text><text x="642" y="244" class="s" fill="#f5f1ff">shared integration contract root</text>
  <path class="l" d="M800 268V310M215 310H1385M215 310V350M610 310V350M1000 310V350M1385 310V350M410 310V520M800 310V520M1190 310V520"/>
  <g filter="url(#shadow)"><rect class="c" x="60" y="350" width="310" height="128" rx="18"/><text x="88" y="395" class="n">◆ contracts/</text><text x="88" y="430" class="s">protobuf · JSON Schema</text><text x="88" y="457" class="s">OpenAPI sources</text></g>
  <g filter="url(#shadow)"><rect class="c" x="455" y="350" width="310" height="128" rx="18"/><text x="483" y="395" class="n">◆ clients/</text><text x="483" y="430" class="s">Python · TypeScript</text><text x="483" y="457" class="s">Go · Rust</text></g>
  <g filter="url(#shadow)"><rect class="c" x="845" y="350" width="310" height="128" rx="18"/><text x="873" y="395" class="n">◆ conformance/</text><text x="873" y="430" class="s">fixtures and compatibility</text><text x="873" y="457" class="s">producer/consumer tests</text></g>
  <g filter="url(#shadow)"><rect class="c" x="1230" y="350" width="310" height="128" rx="18"/><text x="1258" y="395" class="n">◆ docs/</text><text x="1258" y="430" class="s">contract · API · security</text><text x="1258" y="457" class="s">development guidance</text></g>
  <g filter="url(#shadow)"><rect class="c" x="255" y="520" width="310" height="128" rx="18"/><text x="283" y="565" class="n">◆ examples/</text><text x="283" y="600" class="s">minimal producer</text><text x="283" y="627" class="s">and consumer samples</text></g>
  <g filter="url(#shadow)"><rect class="c" x="645" y="520" width="310" height="128" rx="18"/><text x="673" y="565" class="n">◆ versions</text><text x="673" y="600" class="s">compatibility windows</text><text x="673" y="627" class="s">and release contracts</text></g>
  <g filter="url(#shadow)"><rect class="c" x="1035" y="520" width="310" height="128" rx="18"/><text x="1063" y="565" class="n">◆ adapters</text><text x="1063" y="600" class="s">CM5, services, URTC</text><text x="1063" y="627" class="s">bounded integration</text></g>
